<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>数据导出 - 煤炭进销存</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="theme-color" content="#1e3a8a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="煤炭进销存">

</head>
<body class="p-4 bg-gray-100">
<div class="flex justify-between items-center mb-4">
    <div class="flex items-center gap-3">
      <div style="width:40px;height:40px;border-radius:12px;background:linear-gradient(180deg,#ffe9a8,#d4af37 55%,#b18a1f);display:flex;align-items:center;justify-content:center;font-size:21px;box-shadow:inset 0 2px 0 rgba(255,255,255,.85), inset 0 -3px 0 rgba(0,0,0,.25), inset 0 -6px 10px rgba(0,0,0,.15), 0 6px 14px rgba(177,138,31,.45)">📥</div>
      <h1 class="text-xl font-extrabold" style="background:linear-gradient(135deg,#a67c00,#c99a2e);-webkit-background-clip:text;background-clip:text;color:transparent">数据导出</h1>
    </div>
  <div id="userbar"></div>
</div>
<div id="nav" class="mb-4"></div>

<div class="p-4 border rounded bg-gray-50">
  <h3 class="text-lg font-bold mb-3">📥 一键导出全部 Excel</h3>
  <p class="mb-3 text-sm text-gray-600">导出为多工作表 Excel：采购（含全部财务字段）、销售、库存、配煤方案、财务对账。</p>
  <button onclick="exportAll()" class="px-4 py-2 bg-green-600 text-white rounded">一键导出全部Excel</button>
  <div class="mt-4 grid grid-cols-2 md:grid-cols-4 gap-3 text-center">
    <button onclick="exportPurchase()" class="px-3 py-2 bg-blue-500 text-white rounded">导出采购表</button>
    <button onclick="exportSale()" class="px-3 py-2 bg-green-500 text-white rounded">导出销售表</button>
    <button onclick="exportStock()" class="px-3 py-2 bg-orange-500 text-white rounded">导出库存表</button>
    <button onclick="exportFinance()" class="px-3 py-2 bg-purple-500 text-white rounded">导出财务对账</button>
  </div>
</div>

<div class="p-4 border rounded bg-gray-50 mt-4">
  <h3 class="text-lg font-bold mb-2">📋 资质空白表</h3>
  <p class="mb-3 text-sm text-gray-600">下载空白资质表模板，填写后可上传存档；已上传的资质文件可随时下载或删除。</p>
  <div class="grid grid-cols-2 md:grid-cols-5 gap-2 text-center mb-4">
    <button onclick="dlTemplate('营业执照')" class="px-2 py-2 bg-yellow-500 text-white rounded text-sm">营业执照(空白表)</button>
    <button onclick="dlTemplate('煤炭经营许可证')" class="px-2 py-2 bg-amber-600 text-white rounded text-sm">经营许可证(空白表)</button>
    <button onclick="dlTemplate('质检报告')" class="px-2 py-2 bg-teal-500 text-white rounded text-sm">质检报告(空白表)</button>
    <button onclick="dlTemplate('过磅单')" class="px-2 py-2 bg-cyan-600 text-white rounded text-sm">过磅单(空白表)</button>
    <button onclick="dlTemplate('化验报告')" class="px-2 py-2 bg-indigo-500 text-white rounded text-sm">化验报告(空白表)</button>
  </div>
  <div class="flex items-center gap-2 mb-3">
    <input type="file" id="certFile" class="text-sm">
    <button onclick="uploadCert()" class="px-3 py-2 bg-green-600 text-white rounded text-sm">上传资质文件</button>
  </div>
  <table class="w-full text-sm border">
    <thead><tr class="bg-gray-100"><th class="border px-2 py-1 text-left">文件名</th><th class="border px-2 py-1">大小</th><th class="border px-2 py-1">操作</th></tr></thead>
    <tbody id="certList"></tbody>
  </table>
</div>
<script>
function exportAll(){
  const wb = XLSX.utils.book_new();
  // 采购
  const ph=["日期","来源矿点","收货煤场","矿发吨","厂收吨","全水","全硫","空干挥发","收到挥发","热值","煤单价","煤款","运费","居间费","总成本","吨成本",
    "煤款结算状态","煤款已付","煤款备注","运费结算状态","运费已付","运费备注","发票状态","税额","税务备注",
    "居间结算状态","居间已付","居间结算备注"];
  const pd=[ph];
  purchaseList.forEach(p=>pd.push([
    p.date,p.from||p.no,p.to,p.orig,p.settle,p.totalWater,p.sulfur,p.adVola,p.arVola,p.heat,p.coalUnitPrice,p.coalTotalMoney,p.freightTotal,p.brokerAmount,p.totalCostAll,p.tonCostAll,
    p.coalPayStatus,p.coalPaidMoney||0,p.coalPayRemark||"",p.freightSettleStatus,p.freightPaidMoney||0,p.freightRemark||"",
    p.taxInvoiceStatus,p.taxAmount||0,p.taxRemark||"",p.brokerSettleStatus,p.brokerPaidMoney||0,p.brokerPayRemark||""
  ]));
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(pd),"采购");
  // 销售
  const sh=["日期","出货煤场","购货单位","出库矿点1","出库重量","出库矿点2","出库重量","销售过磅吨","运费单价","运费金额","成本单价","成本金额","总金额","销售单价","到厂重量","销售金额","销售收入","毛利","吨煤毛利"];
  const sd=[sh];
  saleList.forEach(s=>sd.push([s.saleDate,s.saleNo,s.buyCompany,s.saleExMine1||"",s.saleExW1||0,s.saleExMine2||"",s.saleExW2||0,s.saleWeight,s.saleFreightPrice||0,s.saleFreightAmount||0,s.saleUnitPrice,s.saleCostAmount||0,s.saleTotalAmount||0,s.saleSellPrice||0,s.saleArriveW||0,s.saleSellAmount||0,s.saleTotalIncome,s.saleProfit,s.saleTonProfit||0]));
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(sd),"销售");
  // 库存
  const st=calcStock();
  const std=[["项目","数值"],["期初库存吨",stockStartTon],["期初库存金额",stockStartMoney],
    ["累计入库吨",st.totalInTon],["累计入库成本",st.totalInMoney],["累计出库吨",st.totalOutTon],
    ["当前库存吨",st.stockRemainTon],["库存金额",st.stockRemainMoney],["加权单价",st.avgCostPrice]];
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(std),"库存");
  // 配煤
  const mh=["序号","配煤总吨","全水Mt","全硫St","空干挥发","收到挥发","热值","原料明细"];
  const md=[mh];
  coalMixRecordList.forEach((it,i)=>{
    let src="";
    it.sourceList.forEach(s=>src+=`${s.source.no}:${s.useTon.toFixed(2)}吨;`);
    md.push([i+1,it.totalTon,it.mt,it.st,it.adVola,it.arVola,it.heat,src]);
  });
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(md),"配煤方案");
  // 财务对账
  const fin=calcFinance();
  const fd=[["项目","金额(元)"],
    ["煤款应付",fin.coalNeed],["煤款已付",fin.coalPaid],["煤款欠款",fin.coalArrears],
    ["运费应付",fin.freightNeed],["运费已付",fin.freightPaid],["运费欠款",fin.freightArrears],
    ["居间应付",fin.brokerNeed],["居间已付",fin.brokerPaid],["居间欠款",fin.brokerArrears],
    ["累计进项税额",fin.taxSum]];
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(fd),"财务对账");

  XLSX.writeFile(wb,"煤炭进销存数据.xlsx");
}
function exportPurchase(){
  const p = purchaseList[0];
  if(!p){ alert("暂无采购数据"); return; }
  // 复用全部导出中的采购 sheet —— 简化：直接导出采购
  const wb = XLSX.utils.book_new();
  const ph=["日期","来源矿点","收货煤场","矿发吨","厂收吨","全水","全硫","空干挥发","收到挥发","热值","煤单价","煤款","运费","居间费","总成本","吨成本",
    "煤款结算状态","煤款已付","煤款备注","运费结算状态","运费已付","运费备注","发票状态","税额","税务备注",
    "居间结算状态","居间已付","居间结算备注"];
  const pd=[ph];
  purchaseList.forEach(p=>pd.push([p.date,p.from||p.no,p.to,p.orig,p.settle,p.totalWater,p.sulfur,p.adVola,p.arVola,p.heat,p.coalUnitPrice,p.coalTotalMoney,p.freightTotal,p.brokerAmount,p.totalCostAll,p.tonCostAll,p.coalPayStatus,p.coalPaidMoney||0,p.coalPayRemark||"",p.freightSettleStatus,p.freightPaidMoney||0,p.freightRemark||"",p.taxInvoiceStatus,p.taxAmount||0,p.taxRemark||"",p.brokerSettleStatus,p.brokerPaidMoney||0,p.brokerPayRemark||""]));
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(pd),"采购");
  XLSX.writeFile(wb,"采购记录.xlsx");
}
function exportSale(){
  if(!saleList.length){ alert("暂无销售数据"); return; }
  const wb=XLSX.utils.book_new();
  const sh=["日期","出货煤场","购货单位","出库矿点1","出库重量","出库矿点2","出库重量","销售过磅吨","运费单价","运费金额","成本单价","成本金额","总金额","销售单价","到厂重量","销售金额","销售收入","毛利","吨煤毛利"];
  const sd=[sh];
  saleList.forEach(s=>sd.push([s.saleDate,s.saleNo,s.buyCompany,s.saleExMine1||"",s.saleExW1||0,s.saleExMine2||"",s.saleExW2||0,s.saleWeight,s.saleFreightPrice||0,s.saleFreightAmount||0,s.saleUnitPrice,s.saleCostAmount||0,s.saleTotalAmount||0,s.saleSellPrice||0,s.saleArriveW||0,s.saleSellAmount||0,s.saleTotalIncome,s.saleProfit,s.saleTonProfit||0]));
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(sd),"销售");
  XLSX.writeFile(wb,"销售记录.xlsx");
}
function exportStock(){
  const st=calcStock();
  const wb=XLSX.utils.book_new();
  const std=[["项目","数值"],["期初库存吨",stockStartTon],["期初库存金额",stockStartMoney],
    ["累计入库吨",st.totalInTon],["累计入库成本",st.totalInMoney],["累计出库吨",st.totalOutTon],
    ["当前库存吨",st.stockRemainTon],["库存金额",st.stockRemainMoney],["加权单价",st.avgCostPrice]];
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(std),"库存");
  XLSX.writeFile(wb,"库存汇总.xlsx");
}
function exportFinance(){
  if(!purchaseList.length){ alert("暂无采购数据"); return; }
  const fin=calcFinance();
  const wb=XLSX.utils.book_new();
  const fd=[["项目","金额(元)"],
    ["煤款应付",fin.coalNeed],["煤款已付",fin.coalPaid],["煤款欠款",fin.coalArrears],
    ["运费应付",fin.freightNeed],["运费已付",fin.freightPaid],["运费欠款",fin.freightArrears],
    ["居间应付",fin.brokerNeed],["居间已付",fin.brokerPaid],["居间欠款",fin.brokerArrears],
    ["累计进项税额",fin.taxSum]];
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(fd),"财务对账");
  XLSX.writeFile(wb,"财务对账.xlsx");
}
// ===== 资质空白表：云端存储(跨设备同步) =====
var certs=[];
var CERT_SITE="西华煤场";
function cloudGetCerts(){
  return cloudPullAppStateBySite(CERT_SITE).then(function(p){
    certs = (p && p.certs) || [];
    renderCerts();
  }).catch(function(){ certs=[]; renderCerts(); });
}
function cloudSaveCerts(){
  return cloudPullAppStateBySite(CERT_SITE).then(function(p){
    p = p || { purchaseList:[], saleList:[], coalMixRecordList:[] };
    p.certs = certs;
    return _cfetch("app_state?site=eq."+encodeURIComponent(CERT_SITE), { method:"PATCH", headers:{ "Prefer":"return=minimal" }, body: JSON.stringify({ payload:p }) });
  });
}
function dlTemplate(name){
  const headers={
    "营业执照":["单位名称","统一社会信用代码","法人","注册地址","有效期"],
    "煤炭经营许可证":["单位名称","许可证号","法定代表人","地址","有效期"],
    "质检报告":["样品名称","检验项目","标准值","检验值","结论"],
    "过磅单":["车牌号","货物名称","毛重","皮重","净重","司磅员"],
    "化验报告":["样品编号","全水Mt","全硫St","空干挥发","收到挥发","灰份","热值"]
  }[name]||["项目","内容"];
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([headers]),"空白表");
  XLSX.writeFile(wb,name+"_空白表.xlsx");
}
function uploadCert(){
  const f=document.getElementById("certFile").files[0];
  if(!f){ alert("请先选择文件"); return; }
  if(f.size>1*1024*1024){ alert("文件不能超过1MB，请压缩或裁剪照片后再传"); return; }
  const btn=event.target; btn.disabled=true;
  const r=new FileReader();
  r.onload=function(){
    certs.push({name:f.name, size:f.size, type:f.type||"", data:r.result, time:new Date().toLocaleString()});
    cloudSaveCerts().then(function(){
      btn.disabled=false;
      renderCerts();
      alert("已上传云端，其他设备同步可见");
    }).catch(function(){
      btn.disabled=false;
      alert("上传云端失败，请稍后重试或压缩文件");
    });
    document.getElementById("certFile").value="";
  };
  r.readAsDataURL(f);
}
function downloadCert(i){
  const c=certs[i]; if(!c) return;
  const a=document.createElement("a");
  a.href=c.data; a.download=c.name; a.click();
}
function delCert(i){
  if(!confirm("确认删除该资质文件？")) return;
  certs.splice(i,1);
  cloudSaveCerts().then(renderCerts);
}
function renderCerts(){
  const tb=document.getElementById("certList");
  tb.innerHTML="";
  if(!certs.length){ tb.innerHTML='<tr><td colspan="3" class="border px-2 py-2 text-center text-gray-400">暂无上传的资质文件</td></tr>'; return; }
  certs.forEach((c,i)=>{
    const kb=(c.size/1024).toFixed(1);
    tb.innerHTML+=`<tr>
      <td class="border px-2 py-1">${c.name}<br><span class="text-xs text-gray-400">${c.time||""}</span></td>
      <td class="border px-2 py-1 text-center">${kb}KB</td>
      <td class="border px-2 py-1 text-center">
        <button onclick="downloadCert(${i})" class="px-2 py-1 bg-blue-500 text-white rounded text-xs">下载</button>
        <button onclick="delCert(${i})" class="px-2 py-1 bg-red-500 text-white rounded text-xs ml-1">删除</button>
      </td></tr>`;
  });
}
loadAllData();
initPage("export.html");
cloudGetCerts();
</script>
</body>
