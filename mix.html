<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>场地配煤 - 煤炭进销存</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
.mix-rec th, .mix-rec td { text-align:center; padding-top:4px; padding-bottom:4px; }
.mix-rec td:nth-child(9) { text-align:left; } /* 原料明细左对齐 */
</style>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="theme-color" content="#1e3a8a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="煤炭进销存">

</head>
<body class="p-4 bg-gray-100">
<div class="flex justify-between items-center mb-4">
    <div class="flex items-center gap-3">
      <div style="width:40px;height:40px;border-radius:12px;background:linear-gradient(180deg,#ffe9a8,#d4af37 55%,#b18a1f);display:flex;align-items:center;justify-content:center;font-size:21px;box-shadow:inset 0 2px 0 rgba(255,255,255,.85), inset 0 -3px 0 rgba(0,0,0,.25), inset 0 -6px 10px rgba(0,0,0,.15), 0 6px 14px rgba(177,138,31,.45)">⚗️</div>
      <h1 class="text-xl font-extrabold" style="background:linear-gradient(135deg,#a67c00,#c99a2e);-webkit-background-clip:text;background-clip:text;color:transparent">场地配煤</h1>
    </div>
  <div id="userbar"></div>
</div>
<div id="nav" class="mb-4"></div>

<div class="bg-white rounded-2xl p-4">
  <div class="flex gap-2 mb-3 flex-wrap" id="mixActions">
    <button onclick="loadPurchaseToCoalMix()" class="px-3 py-2 rounded text-white" style="background:linear-gradient(135deg,#60a5fa,#2563eb);box-shadow:0 3px 10px rgba(37,99,235,.35),inset 0 1px 0 rgba(255,255,255,.4)">加载采购原料</button>
    <button onclick="calcMixCoal()" class="px-3 py-2 rounded text-white" style="background:linear-gradient(135deg,#34d399,#059669);box-shadow:0 3px 10px rgba(5,150,105,.35),inset 0 1px 0 rgba(255,255,255,.4)">计算配煤指标</button>
    <button onclick="saveMixPlan()" class="px-3 py-2 rounded" style="background:linear-gradient(135deg,#e8c55c,#b18a1f);color:#1a1408;box-shadow:0 3px 10px rgba(177,138,31,.4),inset 0 1px 0 rgba(255,255,255,.5)">保存配煤方案（自动入库）</button>
    <button onclick="clearMixTable()" class="px-3 py-2 rounded text-white" style="background:linear-gradient(135deg,#f87171,#dc2626);box-shadow:0 3px 10px rgba(220,38,38,.35),inset 0 1px 0 rgba(255,255,255,.4)">清空</button>
  </div>

  <div class="bg-white rounded-xl p-3 mb-3 max-h-60 overflow-auto">
    <h4 class="font-semibold mb-2">可选采购原料（勾选，填写本次使用吨位）</h4>
    <table class="w-full text-sm">
      <thead><tr>
        <th>选择</th><th>煤场</th><th>来源矿点</th><th>原进厂吨位</th><th>库存</th><th>本次使用吨位</th>
        <th>全水Mt</th><th>全硫St</th><th>空干挥发</th><th>收到挥发</th><th>灰份</th><th>热值</th>
      </tr></thead>
      <tbody id="mixSourceTable"></tbody>
    </table>
  </div>

  <div class="bg-white rounded-xl p-3 mb-3">
    <h4 class="font-semibold mb-2">✅ 配煤加权结果</h4>
    <p>配煤成品名称：<input type="text" id="mixProductName" value="场地配煤" class="border p-1"></p>
    <p>配煤总重量：<span id="mixTotalTon">0.00</span> 吨</p>
    <p>加权全水：<span id="mixMt">0.00</span>% | 全硫：<span id="mixSt">0.00</span>%</p>
    <p>空干挥发：<span id="mixAdVola">0.00</span>% | 收到挥发：<span id="mixArVola">0.00</span>% | 灰份：<span id="mixAsh">0.00</span>%</p>
    <p>加权热值：<span id="mixHeat">0</span> 大卡</p>
  </div>

  <div class="bg-white rounded-xl p-3">
    <h4 class="font-semibold mb-2">📜 已保存配煤方案</h4>
    <table class="w-full text-sm mix-rec">
      <thead><tr class="bg-emerald-50 text-slate-700"><th>序号</th><th>配煤总吨</th><th>全水</th><th>全硫</th><th>空干挥发</th><th>收到挥发</th><th>灰份</th><th>热值</th><th>原料明细</th><th>操作</th></tr></thead>
      <tbody id="mixRecordTable"></tbody>
    </table>
  </div>
</div>

<script src="data.20260922b.js"></script>
<script>
var allMixSource=[];   // 所有煤场原料合并(配煤跨煤场选料)
var allSiteData={};    // 各煤场云端数据缓存(跨煤场扣库存写回用)
function loadPurchaseToCoalMix(){
  const curSite=(typeof currentSite==='function')?currentSite():"西华煤场";
  const sites=(typeof SITES!=="undefined")?SITES:["西华煤场","禹州煤场","告成煤场","叶县煤场"];
  allMixSource=[]; allSiteData={};
  function pushBatch(p,site){
    const settle=p.settle||0; if(settle<=0) return;
    const st=(p.stockRemain ?? p.settle)||0; if(st<=0.001) return; // 库存为0自动隐藏
    allMixSource.push(Object.assign({},p,{_site:site,_settle:settle,_stock:st}));
  }
  purchaseList.forEach(p=>pushBatch(p,curSite)); // 当前煤场(本地)
  renderMixSourceTable();
  // 异步拉其他煤场
  const tasks=sites.filter(s=>s!==curSite).map(s=>{
    return cloudPullAppStateBySite(s).then(d=>{
      if(d){ allSiteData[s]=d; (d.purchaseList||[]).forEach(p=>pushBatch(p,s)); }
    }).catch(()=>{});
  });
  Promise.all(tasks).then(renderMixSourceTable);
}
function renderMixSourceTable(){
  const tb=document.getElementById("mixSourceTable");
  tb.innerHTML="";
  allMixSource.forEach((p,idx)=>{
    tb.innerHTML += `<tr>
      <td><input type="checkbox" data-key="${idx}" class="mix-check"></td>
      <td>${p._site||""}</td>
      <td>${p.from||""}</td><td>${(p._settle).toFixed(2)}</td>
      <td>${(p._stock).toFixed(2)}</td>
      <td><input type="number" step="0.01" min="0" max="${(p._stock).toFixed(2)}" value="${(p._stock).toFixed(2)}"
        data-key="${idx}" class="mix-weight-input w-20 border p-1"></td>
      <td>${p.totalWater}</td><td>${p.sulfur}</td><td>${p.adVola??0}</td><td>${p.arVola}</td><td>${p.ash??0}</td><td>${p.heat}</td>
    </tr>`;
  });
  setTimeout(()=>{
    document.querySelectorAll(".mix-weight-input").forEach(input=>{
      input.onblur=function(){
        const idx=Number(this.dataset.key), p=allMixSource[idx]; if(!p) return;
        let v=parseFloat(this.value)||0;
        if(v>p._stock){ alert(`不能超过库存 ${p._stock.toFixed(2)}吨`); this.value=p._stock.toFixed(2); }
        if(v<0) this.value=0;
      };
    });
  },100);
}
function calcMixCoal(){
  const boxes=document.querySelectorAll(".mix-check:checked");
  mixSelectedList=[];
  let totalTon=0,sumMt=0,sumSt=0,sumAdV=0,sumArV=0,sumAsh=0,sumHeat=0;
  boxes.forEach(cb=>{
    const idx=Number(cb.dataset.key), item=allMixSource[idx];
    const input=document.querySelector(`.mix-weight-input[data-key="${idx}"]`);
    let useW=parseFloat(input.value)||0;
    const stock=item._stock||0;
    if(useW>stock){ alert(`来源${item.from||''}使用重量不能超过库存 ${stock.toFixed(2)}吨`); useW=stock; }
    if(useW<0) useW=0;
    mixSelectedList.push({source:item, useTon:useW});
    totalTon+=useW; sumMt+=item.totalWater*useW; sumSt+=item.sulfur*useW;
    sumAdV+=(item.adVola||0)*useW; sumArV+=item.arVola*useW; sumAsh+=(item.ash||0)*useW; sumHeat+=item.heat*useW;
  });
  document.getElementById("mixTotalTon").innerText=totalTon.toFixed(2);
  document.getElementById("mixMt").innerText=totalTon>0?(sumMt/totalTon).toFixed(2):'0.00';
  document.getElementById("mixSt").innerText=totalTon>0?(sumSt/totalTon).toFixed(2):'0.00';
  document.getElementById("mixAdVola").innerText=totalTon>0?(sumAdV/totalTon).toFixed(2):'0.00';
  document.getElementById("mixArVola").innerText=totalTon>0?(sumArV/totalTon).toFixed(2):'0.00';
  document.getElementById("mixAsh").innerText=totalTon>0?(sumAsh/totalTon).toFixed(2):'0.00';
  document.getElementById("mixHeat").innerText=totalTon>0?roundInt(sumHeat/totalTon):0;
}
function saveMixPlan(){
  const totalTon=parseFloat(document.getElementById("mixTotalTon").innerText);
  if(totalTon<=0){ alert("请先勾选原料并计算配煤！"); return; }
  coalMixRecordList.push({
    totalTon, mt:parseFloat(document.getElementById("mixMt").innerText),
    st:parseFloat(document.getElementById("mixSt").innerText),
    adVola:parseFloat(document.getElementById("mixAdVola").innerText),
    arVola:parseFloat(document.getElementById("mixArVola").innerText),
    ash:parseFloat(document.getElementById("mixAsh").innerText),
    heat:parseFloat(document.getElementById("mixHeat").innerText),
    sourceList:mixSelectedList
  });
  renderMixRecordTable();
  mixStockIn(); // 自动入库：减去原料重量与金额，加入新配煤成品成本(内部统一保存,避免竞态覆盖)
  // 矫正：保存后清空本次勾选与结果，防止重复保存对同一批原料重复减库存/重复生成成品
  mixSelectedList=[];
  document.querySelectorAll(".mix-check").forEach(cb=>{ cb.checked=false; });
  ["mixTotalTon","mixMt","mixSt","mixAdVola","mixArVola","mixAsh"].forEach(i=>{ const el=document.getElementById(i); if(el) el.innerText="0.00"; });
  const h=document.getElementById("mixHeat"); if(h) h.innerText="0";
}
function renderMixRecordTable(){
  const tb=document.getElementById("mixRecordTable");
  tb.innerHTML="";
  coalMixRecordList.forEach((it,i)=>{
    let src="";
    it.sourceList.forEach(s=>{ src+=`${s.source.from||""}:${s.useTon.toFixed(2)}吨;`; });
    tb.innerHTML+=`<tr><td>${i+1}</td><td>${it.totalTon.toFixed(2)}</td><td>${it.mt.toFixed(2)}</td>
      <td>${it.st.toFixed(2)}</td><td>${it.adVola.toFixed(2)}</td><td>${it.arVola.toFixed(2)}</td>
      <td>${(it.ash||0).toFixed(2)}</td><td>${it.heat}</td><td>${src}</td>
      <td>${canDelete() ? `<button onclick="delMixRecord(${i})" class="px-2 py-1 rounded-md bg-red-500 text-white text-xs hover:bg-red-600 transition">删除</button>` : ""}</td></tr>`;
  });
}
function delMixRecord(idx){
  if(!confirm("确认删除该配煤方案？将恢复原料库存并删除对应配煤成品")) return;
  const it = coalMixRecordList[idx];
  if(!it){ renderMixRecordTable(); return; }
  const curSite=(typeof currentSite==='function')?currentSite():"西华煤场";
  const sites=(typeof SITES!=="undefined")?SITES:["西华煤场","禹州煤场","告成煤场","叶县煤场"];
  // 先确保跨煤场数据已加载
  const tasks=sites.filter(s=>s!==curSite && !allSiteData[s]).map(s=>{
    return cloudPullAppStateBySite(s).then(d=>{ if(d) allSiteData[s]=d; }).catch(()=>{});
  });
  Promise.all(tasks).then(()=>{
    // 1. 回滚原料库存(含跨煤场)
    const siteChanged={};
    (it.sourceList||[]).forEach(s=>{
      const src = findSrcForMix(s);
      if(src){
        src.stockRemain = Math.min(src.settle||0, ((src.stockRemain ?? src.settle)||0) + (s.useTon||0));
        const ss=(s.source && s.source._site)||curSite;
        if(ss!==curSite && allSiteData[ss]) siteChanged[ss]=allSiteData[ss];
      }
    });
    // 2. 删除对应配煤成品
    let delIdx = -1;
    if(it.outNo){ delIdx = purchaseList.findIndex(p=>p.no===it.outNo); }
    else {
      let cnt=0;
      purchaseList.forEach((p,i)=>{ if((p.no||"").indexOf("MIX-")===0){ if(cnt===idx) delIdx=i; cnt++; } });
    }
    if(delIdx>=0) purchaseList.splice(delIdx,1);
    // 3. 修正销售记录的批次索引
    saleList.forEach(r=>{
      if(r.saleBatchIdx1===delIdx) r.saleBatchIdx1=-1; else if(r.saleBatchIdx1>delIdx) r.saleBatchIdx1--;
      if(r.saleBatchIdx2===delIdx) r.saleBatchIdx2=-1; else if(r.saleBatchIdx2>delIdx) r.saleBatchIdx2--;
    });
    // 4. 写回跨煤场
    Object.keys(siteChanged).forEach(ss=>{ cloudPushAppStateBySite(ss, siteChanged[ss]); });
    coalMixRecordList.splice(idx,1);
    saveAllData();
    renderMixRecordTable();
    const f=document.getElementById("mixSourceTable");
    if(f) loadPurchaseToCoalMix();
  });
}
function mixStockIn(){
  const totalTon=parseFloat(document.getElementById("mixTotalTon").innerText);
  const productName=document.getElementById("mixProductName").value.trim()||"场地配煤";
  if(totalTon<=0){ alert("先计算配煤才能入库！"); return; }
  let totalMixCost=0;
  const curSite=(typeof currentSite==='function')?currentSite():"西华煤场";
  const siteChanged={};
  mixSelectedList.forEach(rec=>{
    const src=rec.source;
    totalMixCost += (src.totalCostAll/(src.settle||1))*rec.useTon;
    const s=src._site||curSite;
    let batch;
    if(s===curSite){
      batch=purchaseList.find(p=>p.no===src.no);
    } else {
      if(!siteChanged[s]) siteChanged[s]=allSiteData[s]||{purchaseList:[],saleList:[],coalMixRecordList:[],stockStartTon:0,stockStartMoney:0};
      batch=(siteChanged[s].purchaseList||[]).find(p=>p.no===src.no);
    }
    if(batch){ batch.stockRemain=Math.max(0,((batch.stockRemain??batch.settle)-rec.useTon)); }
  });
  // 跨煤场原料:扣完库存写回对应煤场
  Object.keys(siteChanged).forEach(s=>{
    if(s===curSite) return;
    cloudPushAppStateBySite(s, siteChanged[s]);
  });
  totalMixCost=roundInt(totalMixCost);
  const mixNo="MIX-"+Date.now();
  const mt=parseFloat(document.getElementById("mixMt").innerText),
        st=parseFloat(document.getElementById("mixSt").innerText),
        adVola=parseFloat(document.getElementById("mixAdVola").innerText),
        arVola=parseFloat(document.getElementById("mixArVola").innerText),
        ash=parseFloat(document.getElementById("mixAsh").innerText)||0,
        heat=parseFloat(document.getElementById("mixHeat").innerText);
  purchaseList.push({
    date:new Date().toLocaleDateString(), no:mixNo, from:productName, to:(typeof currentSite==='function'?(currentSite()||"西华煤场"):"西华煤场"), car:"", driver:"",
    orig:totalTon, settle:totalTon, stockRemain:totalTon, diff:0, totalWater:mt, sulfur:st, adVola, arVola, ash, heat,
    coalUnitPrice: 0, coalTotalMoney:0, freightTotal:0, brokerAmount:0,
    totalCostAll:totalMixCost, tonCostAll:totalMixCost/totalTon,
    coalPayStatus:"已付清", coalPaidMoney:0, coalPayRemark:"配煤成品(财务煤款记0)",
    freightSettleStatus:"已结清", freightPaidMoney:0, freightRemark:"",
    taxInvoiceStatus:"", taxAmount:0, taxRemark:"",
    brokerSettleStatus:"已结清", brokerPaidMoney:0, brokerPayRemark:"配煤无居间"
  });
  // 记录成品单号到配煤方案，供追溯重算使用
  if(coalMixRecordList.length) coalMixRecordList[coalMixRecordList.length-1].outNo = mixNo;
  saveAllData();
  document.getElementById("mixProductName").value="场地配煤";
  renderMixRecordTable();
  alert(`配煤方案已保存并自动入库！成品：${productName}，${totalTon.toFixed(2)}吨`);
}
function clearMixTable(){
  document.getElementById("mixSourceTable").innerHTML="";
  mixSelectedList=[];
  ["mixTotalTon","mixMt","mixSt","mixAdVola","mixArVola","mixHeat"].forEach(i=>document.getElementById(i).innerText="0.00");
  document.getElementById("mixHeat").innerText="0";
}
loadAllData();
initPage("mix.html");
// 只读用户隐藏配煤操作按钮
if(!canEdit("mix")){
  const a = document.getElementById("mixActions");
  if(a) a.innerHTML = `<div class="text-sm text-gray-500 p-2">当前账号为只读权限，仅可查看已保存配煤方案。</div>`;
}
renderMixRecordTable();
onCloudReady(renderMixRecordTable); // 云端数据同步后自动重渲染配煤记录
</script>
</body>
</html>
