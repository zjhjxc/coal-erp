<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>财务管理 - 煤炭进销存</title>
<script src="https://cdn.tailwindcss.com"></script>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="theme-color" content="#1e3a8a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="煤炭进销存">

</head>
<body class="p-4 bg-gray-100">
<div class="flex justify-between items-center mb-4">
    <div class="flex items-center gap-3">
      <div style="width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#d4af37,#b18a1f);display:flex;align-items:center;justify-content:center;font-size:21px;box-shadow:0 4px 12px rgba(177,138,31,.3)">💰</div>
      <h1 class="text-xl font-extrabold" style="background:linear-gradient(135deg,#a67c00,#c99a2e);-webkit-background-clip:text;background-clip:text;color:transparent">财务管理</h1>
    </div>
  <div id="userbar"></div>
</div>
<div id="nav" class="mb-4"></div>

<div class="p-4 border rounded bg-gray-50">
  <h3 class="text-lg font-bold mb-3">💰 财务汇总</h3>
  <div id="finSummary" class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-4"></div>
</div>

<div class="p-4 border rounded bg-gray-50 mt-4">
  <h3 class="text-lg font-bold mb-3">📋 批次结算对账明细</h3>
  <div class="border p-3 rounded bg-white overflow-x-auto">
    <table class="w-full text-sm">
      <thead><tr>
        <th>来源矿点</th><th>日期</th><th>煤款应/已/欠</th><th>运费应/已/欠</th><th>居间应/已/欠</th><th>税额</th>
      </tr></thead>
      <tbody id="finTableBody"></tbody>
    </table>
  </div>
</div>

<div class="p-4 border rounded bg-gray-50 mt-4">
  <h3 class="text-lg font-bold mb-3">📤 销售记录</h3>
  <div class="border p-3 rounded bg-white overflow-x-auto">
    <table class="w-full text-sm" style="table-layout:fixed">
      <colgroup>
        <col style="width:11%"><col style="width:11%"><col style="width:12%">
        <col style="width:11%"><col style="width:11%"><col style="width:11%">
        <col style="width:11%"><col style="width:11%"><col style="width:11%">
      </colgroup>
      <thead><tr class="bg-slate-100">
        <th class="px-2 py-2.5 text-left">日期</th>
        <th class="px-2 py-2.5 text-left">出货煤场</th>
        <th class="px-2 py-2.5 text-left">购货单位</th>
        <th class="px-2 py-2.5 text-right">销售过磅吨</th>
        <th class="px-2 py-2.5 text-right">销售金额</th>
        <th class="px-2 py-2.5 text-right">成本金额</th>
        <th class="px-2 py-2.5 text-right">运费金额</th>
        <th class="px-2 py-2.5 text-right">总金额</th>
        <th class="px-2 py-2.5 text-right">毛利</th>
      </tr></thead>
      <tbody id="finSaleBody"></tbody>
    </table>
  </div>
</div>

<script src="data.js?v=20260918c"></script>
<script>
function renderFinance(){
  const fin = calcFinance();
  document.getElementById("finSummary").innerHTML = `
    <div class="border p-2 rounded bg-white">💵 煤款：应付${fin.coalNeed}，已付${fin.coalPaid}，<b>欠款${fin.coalArrears}</b> 元</div>
    <div class="border p-2 rounded bg-white">🚚 运费：应付${fin.freightNeed}，已付${fin.freightPaid}，<b>欠款${fin.freightArrears}</b> 元</div>
    <div class="border p-2 rounded bg-white">🤝 居间：应付${fin.brokerNeed}，已付${fin.brokerPaid}，<b>欠款${fin.brokerArrears}</b> 元</div>
    <div class="border p-2 rounded bg-white">🧾 累计进项税额：${fin.taxSum} 元</div>`;

  const tb=document.getElementById("finTableBody");
  tb.innerHTML="";
  purchaseList.forEach(p=>{
    tb.innerHTML += `<tr>
      <td>${p.from||p.no}</td><td>${p.date}</td>
      <td>${p.coalTotalMoney}/${p.coalPaidMoney||0}/${p.coalTotalMoney-(p.coalPaidMoney||0)}</td>
      <td>${p.freightTotal}/${p.freightPaidMoney||0}/${p.freightTotal-(p.freightPaidMoney||0)}</td>
      <td>${p.brokerAmount}/${p.brokerPaidMoney||0}/${p.brokerAmount-(p.brokerPaidMoney||0)}</td>
      <td>${p.taxAmount||0}</td>
    </tr>`;
  });

  // 销售记录
  const sb=document.getElementById("finSaleBody");
  sb.innerHTML="";
  if(!saleList.length){
    sb.innerHTML = `<tr><td colspan="9" class="text-center text-gray-400 py-4">暂无销售记录</td></tr>`;
  } else {
    saleList.forEach(r=>{
      const profit = r.saleProfit||0;
      sb.innerHTML += `<tr class="border-t border-slate-100 odd:bg-white even:bg-slate-50/50">
        <td class="px-2 py-2.5">${r.saleDate||""}</td>
        <td class="px-2 py-2.5">${r.saleNo||""}</td>
        <td class="px-2 py-2.5">${r.buyCompany||""}</td>
        <td class="px-2 py-2.5 text-right tabular-nums">${(r.saleWeight||0).toFixed(2)}</td>
        <td class="px-2 py-2.5 text-right tabular-nums font-semibold">${r.saleSellAmount||0}</td>
        <td class="px-2 py-2.5 text-right tabular-nums">${r.saleCostAmount||0}</td>
        <td class="px-2 py-2.5 text-right tabular-nums">${r.saleFreightAmount||0}</td>
        <td class="px-2 py-2.5 text-right tabular-nums">${r.saleTotalAmount||0}</td>
        <td class="px-2 py-2.5 text-right tabular-nums font-semibold" style="color:${profit>=0?"#16a34a":"#dc2626"}">${profit}</td>
      </tr>`;
    });
  }
}
loadAllData();
initPage("finance.html");
renderFinance();
onCloudReady(renderFinance); // 云端数据同步后自动重渲染
</script>
</body>
</html>
