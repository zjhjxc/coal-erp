<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>总览看板 - 煤炭进销存</title>
<script src="https://cdn.tailwindcss.com"></script>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="theme-color" content="#1e3a8a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="煤炭进销存">

</head>
<body class="min-h-screen bg-gradient-to-br from-slate-100 via-gray-50 to-blue-50 p-4">
<div class="flex justify-between items-center mb-4 flex-wrap gap-2">
  <div class="flex items-center gap-3">
    <div style="width:46px;height:46px;border-radius:13px;background:linear-gradient(135deg,#2563eb,#4f46e5);color:#fff;display:flex;align-items:center;justify-content:center;font-size:24px;box-shadow:0 4px 14px rgba(59,130,246,.35)">⛏️</div>
    <div>
      <h1 class="text-2xl font-extrabold" style="background:linear-gradient(135deg,#1e3a8a,#2563eb);-webkit-background-clip:text;background-clip:text;color:transparent">煤炭进销存管理系统</h1>
      <div class="text-xs text-slate-400 mt-0.5">煤炭 · 仓储 · 财务 一体化管理</div>
    </div>
  </div>
  <div id="userbar"></div>
</div>
<div id="nav" class="mb-5"></div>

<div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-5">
  <div class="flex items-center gap-2 mb-4">
    <div class="w-1.5 h-6 rounded bg-blue-600"></div>
    <h3 class="text-lg font-bold text-slate-800">库存 & 财务总览</h3>
  </div>
  <div id="boardHtml"></div>
</div>

<div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-5 mt-4">
  <div class="flex items-center gap-2 mb-4">
    <div class="w-1.5 h-6 rounded bg-emerald-600"></div>
    <h3 class="text-lg font-bold text-slate-800">📦 库存明细（按来源）</h3>
  </div>
  <div class="border border-slate-200 rounded-xl overflow-x-auto">
    <table class="w-full text-sm" style="table-layout:fixed">
      <colgroup>
        <col style="width:28%"><col style="width:24%"><col style="width:24%"><col style="width:24%">
      </colgroup>
      <thead><tr class="bg-slate-100 text-slate-700">
        <th class="px-3 py-2.5 text-left font-semibold">来源</th>
        <th class="px-3 py-2.5 text-right font-semibold">入库吨</th>
        <th class="px-3 py-2.5 text-right font-semibold">入库成本(元)</th>
        <th class="px-3 py-2.5 text-right font-semibold">占比</th>
      </tr></thead>
      <tbody id="stockDetailBody"></tbody>
    </table>
  </div>
</div>

<div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-5 mt-4">
  <div class="flex items-center gap-2 mb-4">
    <div class="w-1.5 h-6 rounded bg-amber-500"></div>
    <h3 class="text-lg font-bold text-slate-800">💰 财务结算核对（按批次）</h3>
  </div>
  <p class="text-sm text-slate-500 mb-2">供财务人员逐笔核对煤款、运费、税务、居间的结算状态与金额。</p>
  <div class="border border-slate-200 rounded-xl overflow-x-auto">
    <table class="w-full text-sm" style="table-layout:fixed">
      <colgroup>
        <col style="width:9%"><col style="width:9%">
        <col style="width:17%"><col style="width:17%"><col style="width:17%"><col style="width:13%"><col style="width:18%">
      </colgroup>
      <thead><tr class="bg-slate-100 text-slate-700">
        <th class="px-2 py-2.5 text-left font-semibold">日期</th><th class="px-2 py-2.5 text-left font-semibold">来源矿点</th>
        <th class="px-2 py-2.5 text-left font-semibold">煤款结算</th><th class="px-2 py-2.5 text-left font-semibold">运费结算</th><th class="px-2 py-2.5 text-left font-semibold">居间结算</th><th class="px-2 py-2.5 text-right font-semibold">总金额</th><th class="px-2 py-2.5 text-left font-semibold">税务发票</th>
      </tr></thead>
      <tbody id="finCheckBody"></tbody>
    </table>
  </div>
</div>

<!-- 销售记录 -->
<div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-5 mt-4">
  <div class="flex items-center gap-2 mb-4">
    <div class="w-1.5 h-6 rounded bg-indigo-600"></div>
    <h3 class="text-lg font-bold text-slate-800">📤 销售记录</h3>
  </div>
  <div class="border border-slate-200 rounded-xl overflow-x-auto">
    <table class="w-full text-sm" style="table-layout:fixed">
      <colgroup>
        <col style="width:11%"><col style="width:11%"><col style="width:12%">
        <col style="width:11%"><col style="width:11%"><col style="width:11%">
        <col style="width:11%"><col style="width:11%"><col style="width:11%">
      </colgroup>
      <thead><tr class="bg-slate-100 text-slate-700">
        <th class="px-2 py-2.5 text-left font-semibold">日期</th>
        <th class="px-2 py-2.5 text-left font-semibold">出货煤场</th>
        <th class="px-2 py-2.5 text-left font-semibold">购货单位</th>
        <th class="px-2 py-2.5 text-right font-semibold">销售过磅吨</th>
        <th class="px-2 py-2.5 text-right font-semibold">销售单价</th>
        <th class="px-2 py-2.5 text-right font-semibold">到厂重量</th>
        <th class="px-2 py-2.5 text-right font-semibold">销售金额</th>
        <th class="px-2 py-2.5 text-right font-semibold">总金额</th>
        <th class="px-2 py-2.5 text-right font-semibold">毛利</th>
      </tr></thead>
      <tbody id="saleRecordBody"></tbody>
    </table>
  </div>
</div>

<script src="data.js?v=20260918g"></script>
<script>
// 财务结算单格：状态 / 金额 / 备注
function finCell(status, needMoney, paidMoney, remark){
  let s = status || "-";
  let money = "";
  if(needMoney !== undefined && needMoney !== null){
    money = `应付${roundInt(needMoney)} 已付${roundInt(paidMoney||0)} 欠${roundInt(needMoney-(paidMoney||0))}`;
  }
  let r = remark ? `备注：${remark}` : "";
  let color = "";
  if(s === "已付清" || s === "已结清" || s === "已收票") color = "color:#16a34a";
  else if(s === "部分付款" || s === "部分结算" || s === "部分开票") color = "color:#d97706";
  else if(s === "未付款" || s === "未结算" || s === "未开票") color = "color:#dc2626";
  return `<div style="${color};font-weight:600">${s}</div><div>${money}</div><div class="text-gray-500 text-xs">${r}</div>`;
}
// 库存明细（按来源汇总入库）
function renderStockDetail(){
  const sd = document.getElementById("stockDetailBody");
  const stock = calcStock();
  const map = {};
  purchaseList.forEach(p=>{
    const k = p.from || "(无来源)";
    if(!map[k]) map[k] = { ton:0, cost:0 };
    map[k].ton += p.settle;
    map[k].cost += p.totalCostAll;
  });
  sd.innerHTML="";
  if(!Object.keys(map).length){
    sd.innerHTML = `<tr><td colspan="4" class="text-center text-gray-400 py-4">暂无库存数据</td></tr>`;
    return;
  }
  const totalTon = stock.totalInTon || 1;
  let rows = "";
  Object.keys(map).forEach(k=>{
    const item = map[k];
    const pct = (item.ton / totalTon * 100).toFixed(1);
    rows += `<tr class="border-t border-slate-100 odd:bg-white even:bg-slate-50/50">
      <td class="px-3 py-2.5">${k}</td>
      <td class="px-3 py-2.5 text-right tabular-nums">${item.ton.toFixed(2)}</td>
      <td class="px-3 py-2.5 text-right tabular-nums">${roundInt(item.cost)}</td>
      <td class="px-3 py-2.5 text-right tabular-nums">${pct}%</td>
    </tr>`;
  });
  // 合计行
  rows += `<tr class="bg-slate-100 font-semibold">
    <td class="px-3 py-2.5">合计 / 当前结余</td>
    <td class="px-3 py-2.5 text-right tabular-nums">${stock.totalInTon.toFixed(2)} 吨（结余 ${stock.stockRemainTon.toFixed(2)}）</td>
    <td class="px-3 py-2.5 text-right tabular-nums">${roundInt(stock.totalInMoney)} 元</td>
    <td class="px-3 py-2.5 text-right tabular-nums">100%</td>
  </tr>`;
  sd.innerHTML = rows;
}
// 总览看板：销售记录
function renderSaleRecords(){
  const tb = document.getElementById("saleRecordBody");
  tb.innerHTML = "";
  if(!saleList.length){
    tb.innerHTML = `<tr><td colspan="9" class="text-center text-gray-400 py-4">暂无销售记录</td></tr>`;
    return;
  }
  saleList.forEach(r=>{
    const profit = r.saleProfit||0;
    tb.innerHTML += `<tr class="border-t border-slate-100 odd:bg-white even:bg-slate-50/50">
      <td class="px-2 py-2.5">${r.saleDate||""}</td>
      <td class="px-2 py-2.5">${r.saleNo||""}</td>
      <td class="px-2 py-2.5">${r.buyCompany||""}</td>
      <td class="px-2 py-2.5 text-right tabular-nums">${(r.saleWeight||0).toFixed(2)}</td>
      <td class="px-2 py-2.5 text-right tabular-nums">${r.saleSellPrice?(r.saleSellPrice.toFixed(2)):"0.00"}</td>
      <td class="px-2 py-2.5 text-right tabular-nums">${r.saleArriveW?(r.saleArriveW.toFixed(2)):"0.00"}</td>
      <td class="px-2 py-2.5 text-right tabular-nums font-semibold">${r.saleSellAmount||0}</td>
      <td class="px-2 py-2.5 text-right tabular-nums">${r.saleTotalAmount||0}</td>
      <td class="px-2 py-2.5 text-right tabular-nums font-semibold" style="color:${profit>=0?"#16a34a":"#dc2626"}">${profit}</td>
    </tr>`;
  });
}
function renderBoard(){
  const stock = calcStock();
  const fin = calcFinance();
  let saleIncome=0, saleCost=0, profit=0, saleTon=0;
  // 配煤出入库统计
  let mixInTon=0, mixInCost=0;
  saleList.forEach(s=>{ saleIncome+=s.saleTotalIncome; saleCost+=s.saleTotalCost; profit+=s.saleProfit; saleTon+=s.saleWeight||0; });
  purchaseList.forEach(p=>{ if((p.no||"").indexOf("MIX-")===0){ mixInTon+=p.settle; mixInCost+=p.totalCostAll; } });
  const html = `
  <div class="grid grid-cols-2 md:grid-cols-3 gap-3">
    <div class="stat stat-blue"><div class="stat-label">期初库存</div><div class="stat-val"><b>${stockStartTon.toFixed(2)}</b><span>吨</span></div><div class="stat-sub">${stockStartMoney}元</div></div>
    <div class="stat stat-cyan"><div class="stat-label">累计入库</div><div class="stat-val"><b>${stock.totalInTon.toFixed(2)}</b><span>吨</span></div><div class="stat-sub">成本 ${stock.totalInMoney}元</div></div>
    <div class="stat stat-violet"><div class="stat-label">累计出库</div><div class="stat-val"><b>${stock.totalOutTon.toFixed(2)}</b><span>吨</span></div><div class="stat-sub">金额 ${saleCost}元</div></div>
    <div class="stat stat-green"><div class="stat-label">当前库存</div><div class="stat-val"><b>${stock.stockRemainTon.toFixed(2)}</b><span>吨</span></div><div class="stat-sub">金额 ${stock.stockRemainMoney}元</div></div>
    <div class="stat stat-slate"><div class="stat-label">库存加权单价</div><div class="stat-val"><b>${stock.avgCostPrice.toFixed(2)}</b><span>元/吨</span></div></div>
    <div class="stat stat-amber"><div class="stat-label">总销售收入</div><div class="stat-val"><b>${saleIncome}</b><span>元</span></div><div class="stat-sub">吨位 ${saleTon.toFixed(2)}吨 · 毛利 ${profit}元</div></div>
    <div class="stat stat-emerald"><div class="stat-label">配煤入库</div><div class="stat-val"><b>${mixInTon.toFixed(2)}</b><span>吨</span></div><div class="stat-sub">成本 ${roundInt(mixInCost)}元</div></div>
    <div class="stat stat-amber"><div class="stat-label">煤款</div><div class="stat-val"><b>${fin.coalNeed}</b><span>应付</span></div><div class="stat-sub">已付 ${fin.coalPaid} · 欠款 ${fin.coalArrears}元</div></div>
    <div class="stat stat-cyan"><div class="stat-label">运费</div><div class="stat-val"><b>${fin.freightNeed}</b><span>应付</span></div><div class="stat-sub">已付 ${fin.freightPaid} · 欠款 ${fin.freightArrears}元</div></div>
    <div class="stat stat-violet"><div class="stat-label">居间费</div><div class="stat-val"><b>${fin.brokerNeed}</b><span>应付</span></div><div class="stat-sub">已付 ${fin.brokerPaid} · 欠款 ${fin.brokerArrears}元</div></div>
    <div class="stat stat-red"><div class="stat-label">累计进项税额</div><div class="stat-val"><b>${fin.taxSum}</b><span>元</span></div></div>
  </div>`;
  document.getElementById("boardHtml").innerHTML = html;

  // 库存明细
  renderStockDetail();
  // 销售记录
  renderSaleRecords();

  // 财务结算核对表（逐批次）
  const fb=document.getElementById("finCheckBody");
  fb.innerHTML="";
  if(!purchaseList.length){
    fb.innerHTML = `<tr><td colspan="7" class="text-center text-gray-400 py-4">暂无采购记录</td></tr>`;
    return;
  }
  purchaseList.forEach(p=>{
    fb.innerHTML += `<tr class="align-top border-t border-slate-100 odd:bg-white even:bg-slate-50/50">
      <td class="px-2 py-2.5">${p.date||""}</td><td class="px-2 py-2.5">${p.from||p.no}</td>
      <td class="px-2 py-2.5">${finCell(p.coalPayStatus, p.coalTotalMoney, p.coalPaidMoney, p.coalPayRemark)}</td>
      <td class="px-2 py-2.5">${finCell(p.freightSettleStatus, p.freightTotal, p.freightPaidMoney, p.freightRemark)}</td>
      <td class="px-2 py-2.5">${finCell(p.brokerSettleStatus, p.brokerAmount, p.brokerPaidMoney, p.brokerPayRemark)}</td>
      <td class="px-2 py-2.5 text-right tabular-nums font-bold text-slate-800">${roundInt((p.coalTotalMoney||0)+(p.freightTotal||0)+(p.brokerAmount||0))}</td>
      <td class="px-2 py-2.5">${finCell(p.taxInvoiceStatus, p.taxAmount, null, p.taxRemark)}</td>
    </tr>`;
  });
}
function clearAllData(){
  if(!isAdmin()){ alert("仅管理员可清空数据"); return; }
  if(!confirm("确定清空全部数据？操作不可恢复！")) return;
  localStorage.removeItem(dataKey());
  location.reload();
}
loadAllData();
initPage("index.html");
renderBoard();
onCloudReady(renderBoard); // 云端数据同步到本页后自动重渲染
</script>
</body>
</html>
