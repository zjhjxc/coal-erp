    <div style="text-align:center;margin-bottom:24px">
      <div style="width:76px;height:76px;margin:0 auto 16px;border-radius:22px;background:linear-gradient(135deg,#f7d98b,#d4af37 45%,#b18a1f);display:flex;align-items:center;justify-content:center;font-size:40px;box-shadow:0 10px 30px rgba(177,138,31,.4);position:relative;border:1px solid rgba(255,255,255,.5)"><span>⛏️</span><span style="position:absolute;inset:-7px;border-radius:28px;border:2px solid rgba(201,154,46,.35)"></span></div>

    <p class="text-center text-xs mt-5" style="color:#9a8a60">默认管理员：丁浩伦 / 123456</p>

<script src="data.js?v=20260918d"></script>
<script>
function doLogin(){
  const u = document.getElementById("username").value.trim();
  const p = document.getElementById("password").value;
  if(!u || !p){ document.getElementById("msg").textContent="请输入用户名和密码"; return false; }
  const finish = function(users){
    if(!users) return false;
    const found = users.find(x => x.username===u && x.password===p);
    if(!found) return false;
    localStorage.setItem(SESSION_KEY, JSON.stringify({ username:found.username, name:found.name, role:found.role, site:found.site||"西华煤场", sites: Array.isArray(found.sites)&&found.sites.length ? found.sites : [found.site||"西华煤场"], perms: found.perms||{} }));
    if(found.role!=="admin") localStorage.removeItem("coalViewSite"); // 普通用户每次登录回到自己的默认煤场，不继承共享终端的残留选择
    const rb=document.getElementById("remember");
    if(rb && rb.checked){ try{ localStorage.setItem("coalRemember", JSON.stringify({u:u,p:p})); }catch(e){} }
    else { localStorage.removeItem("coalRemember"); }
    location.href = "index.html";
    return true;
  };
  const local = loadUsers();
  // 云端用户表优先（含管理员最新开放的煤场），本地作为离线兜底；避免本地旧数据覆盖云端新权限
  cloudPullUsers().then(function(cu){
    let src = (cu && cu.length) ? cu : local;
    if(finish(src)){ if(cu && cu.length) saveUsers(cu); return; }
    if(src !== local && finish(local)) return;
    document.getElementById("msg").textContent="用户名或密码错误";
  }).catch(function(){
    if(!finish(local)) document.getElementById("msg").textContent="用户名或密码错误";
  });
  return false;
}
// 已登录自动进入系统；否则自动填充记住的账号密码（手机点开图标直接可用）
(function(){
  try{ if(localStorage.getItem(SESSION_KEY)){ location.href="index.html"; return; } }catch(e){}
  try{
    const r=JSON.parse(localStorage.getItem("coalRemember")||"null");
    if(r && r.u){ document.getElementById("username").value=r.u; if(r.p) document.getElementById("password").value=r.p; }
  }catch(e){}
})();
</script>
