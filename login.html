<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>登录 - 煤炭进销存</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen flex items-center justify-center p-4" style="background:linear-gradient(135deg,#0f172a,#1e3a8a 50%,#2563eb)">
<div style="position:fixed;inset:0;overflow:hidden;pointer-events:none">
  <div style="position:absolute;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.06);top:-60px;right:-40px"></div>
  <div style="position:absolute;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.05);bottom:-40px;left:-30px"></div>
</div>
<div class="w-full max-w-sm relative">
  <div style="text-align:center;margin-bottom:20px">
    <div style="width:66px;height:66px;margin:0 auto 12px;border-radius:18px;background:linear-gradient(135deg,#2563eb,#4f46e5);display:flex;align-items:center;justify-content:center;font-size:34px;box-shadow:0 8px 26px rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.15)">⛏️</div>
    <h1 class="text-2xl font-extrabold text-white" style="text-shadow:0 2px 10px rgba(0,0,0,.3)">煤炭进销存管理系统</h1>
    <p class="text-sm text-blue-100/80 mt-1">煤炭 · 仓储 · 财务 一体化管理</p>
  </div>
  <div class="bg-white rounded-2xl shadow-2xl p-7">
    <form id="loginForm" onsubmit="return doLogin()" autocomplete="on">
      <div class="mb-4">
        <label class="text-sm font-medium text-slate-600">用户名</label>
        <input type="text" id="username" name="username" autocomplete="username" class="mt-1 w-full border border-slate-300 rounded-xl px-4 py-2.5 text-sm focus:outline-none" placeholder="请输入用户名">
      </div>
      <div class="mb-5">
        <label class="text-sm font-medium text-slate-600">密码</label>
        <input type="password" id="password" name="password" autocomplete="current-password" class="mt-1 w-full border border-slate-300 rounded-xl px-4 py-2.5 text-sm focus:outline-none" placeholder="请输入密码">
      </div>
      <button type="submit" class="w-full py-2.5 rounded-xl text-white font-semibold text-sm cursor-pointer" style="background:linear-gradient(135deg,#2563eb,#4f46e5);box-shadow:0 4px 16px rgba(59,130,246,.4)">登 录</button>
    </form>
    <p class="text-center text-xs text-slate-400 mt-4">默认管理员：丁浩伦 / 123456</p>
    <p id="msg" class="text-center text-sm text-red-500 mt-2"></p>
  </div>
</div>
<script src="data.js"></script>
<script>
function doLogin(){
  const u = document.getElementById("username").value.trim();
  const p = document.getElementById("password").value;
  if(!u || !p){ document.getElementById("msg").textContent="请输入用户名和密码"; return false; }
  const finish = function(users){
    const found = users.find(x => x.username===u && x.password===p);
    if(!found){ document.getElementById("msg").textContent="用户名或密码错误"; return false; }
    localStorage.setItem(SESSION_KEY, JSON.stringify({ username:found.username, name:found.name, role:found.role, site:found.site||"西华煤场", perms: found.perms||{} }));
    cloudPushUsers(users); // 登录成功，把当前用户表同步到云端
    location.href = "index.html";
    return false;
  };
  const local = loadUsers();
  if(local.find(x => x.username===u && x.password===p)){ return finish(local); }
  // 本地无此用户：从云端拉取用户表再匹配
  cloudPullUsers().then(function(cu){
    if(cu && cu.length){ saveUsers(cu); finish(cu); }
    else { document.getElementById("msg").textContent="用户名或密码错误"; }
  });
  return false;
}
</script>
</body>
</html>
