<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>登录 - 煤炭进销存</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
#loginForm input:focus{border-color:#c99a2e!important;box-shadow:0 0 0 3px rgba(201,154,46,.18)!important}
#loginForm input::placeholder{color:#a89a80}
</style>
</head>
<body class="min-h-screen flex items-center justify-center p-4" style="background:linear-gradient(160deg,#faf8f1 0%,#f4ecd9 55%,#ece1c6 100%)">
<div style="position:fixed;inset:0;overflow:hidden;pointer-events:none">
  <div style="position:absolute;width:380px;height:380px;border-radius:50%;background:radial-gradient(circle,rgba(201,154,46,.18),transparent 70%);top:-100px;right:-80px"></div>
  <div style="position:absolute;width:340px;height:340px;border-radius:50%;background:radial-gradient(circle,rgba(201,154,46,.14),transparent 70%);bottom:-90px;left:-70px"></div>
  <div style="position:absolute;width:150px;height:150px;border-radius:50%;background:radial-gradient(circle,rgba(245,215,120,.2),transparent 70%);top:16%;left:12%"></div>
  <svg style="position:absolute;bottom:0;left:0;width:100%;opacity:.5" viewBox="0 0 1440 120" fill="none" preserveAspectRatio="none">
    <path d="M0,90 C240,40 480,120 720,80 C960,40 1200,100 1440,60 L1440,120 L0,120 Z" fill="rgba(201,154,46,.10)"></path>
    <path d="M0,112 C300,72 600,126 900,96 C1100,76 1300,110 1440,90 L1440,120 L0,120 Z" fill="rgba(201,154,46,.14)"></path>
  </svg>
</div>

<div class="w-full max-w-sm relative">
  <div class="rounded-3xl p-8" style="background:#ffffff;border:1px solid rgba(201,154,46,.45);box-shadow:0 25px 60px rgba(120,90,30,.18),0 0 50px rgba(201,154,46,.08)">
    <div style="text-align:center;margin-bottom:24px">
      <div style="width:76px;height:76px;margin:0 auto 16px;border-radius:22px;background:linear-gradient(135deg,#f7d98b,#d4af37 45%,#b18a1f);display:flex;align-items:center;justify-content:center;font-size:40px;box-shadow:0 10px 30px rgba(177,138,31,.4);position:relative;border:1px solid rgba(255,255,255,.5)"><span>⛏️</span><span style="position:absolute;inset:-7px;border-radius:28px;border:2px solid rgba(201,154,46,.35)"></span></div>
      <h1 class="text-2xl font-extrabold" style="background:linear-gradient(135deg,#b18a1f,#c99a2e 50%,#a67c00);-webkit-background-clip:text;background-clip:text;color:transparent">煤炭进销存管理系统</h1>
      <p class="text-xs mt-2" style="color:#8a7a55;letter-spacing:.08em">煤炭 · 仓储 · 财务 一体化管理</p>
    </div>
    <form id="loginForm" onsubmit="return doLogin()" autocomplete="on">
      <div class="mb-4">
        <label class="text-sm font-medium" style="color:#6b5d3a">用户名</label>
        <div style="position:relative" class="mt-1">
          <span style="position:absolute;left:13px;top:50%;transform:translateY(-50%);color:#b18a1f;display:flex"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span>
          <input type="text" id="username" name="username" autocomplete="username" placeholder="请输入用户名" style="padding:11px 14px 11px 40px;width:100%;border:1px solid #d9c7a0;border-radius:12px;font-size:14px;background:#fffdf7;color:#3a3320;box-sizing:border-box">
        </div>
      </div>
      <div class="mb-5">
        <label class="text-sm font-medium" style="color:#6b5d3a">密码</label>
        <div style="position:relative" class="mt-1">
          <span style="position:absolute;left:13px;top:50%;transform:translateY(-50%);color:#b18a1f;display:flex"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></span>
          <input type="password" id="password" name="password" autocomplete="current-password" placeholder="请输入密码" style="padding:11px 14px 11px 40px;width:100%;border:1px solid #d9c7a0;border-radius:12px;font-size:14px;background:#fffdf7;color:#3a3320;box-sizing:border-box">
        </div>
      </div>
      <button type="submit" class="w-full py-3 rounded-xl font-semibold text-sm cursor-pointer" style="background:linear-gradient(135deg,#f7d98b,#d4af37 55%,#b18a1f);color:#1a1408;box-shadow:0 8px 24px rgba(177,138,31,.35);border:none">登 录</button>
    </form>
    <p class="text-center text-xs mt-5" style="color:#9a8a60">默认管理员：丁浩伦 / 123456</p>
    <p id="msg" class="text-center text-sm mt-2" style="color:#dc2626"></p>
  </div>
  <p style="text-align:center;color:#a08c50;font-size:12px;margin-top:16px;letter-spacing:.06em">煤炭进销存 · 云端实时同步</p>
</div>
<script src="data.js"></script>
<script>
function doLogin(){
  const u = document.getElementById("username").value.trim();
  const p = document.getElementById("password").value;
  if(!u || !p){ document.getElementById("msg").textContent="请输入用户名和密码"; return false; }
  const finish = function(users){
    const found = users.find(x => x.username===u && x.password===p);
    if(!found){ document.getElementById("msg").textContent="用户名或密码错误"; return false; }
    localStorage.setItem(SESSION_KEY, JSON.stringify({ username:found.username, name:found.name, role:found.role, site:found.site||"西华煤场", sites: Array.isArray(found.sites)&&found.sites.length ? found.sites : [found.site||"西华煤场"], perms: found.perms||{} }));
    cloudPushUsers(users); // 登录成功，把当前用户表同步到云端
    location.href = "index.html";
    return false;
  };
  const local = loadUsers();
  if(local.find(x => x.username===u && x.password===p)){ return finish(local); }
  // 本地无此用户：从云端拉取用户表再匹配
  cloudPullUsers().then(function(cu){
    if(cu && cu.length){ saveUsers(cu); finish(cu); }
    else { document.getElementById("msg").textContent="用户名或密码错误"; }
  });
  return false;
}
</script>
</body>
</html>
